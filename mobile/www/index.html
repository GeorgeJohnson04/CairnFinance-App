<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cairn</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-content: center;
    text-align: center; padding: 2rem; gap: .75rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #faf8ff; color: #1a1430;
  }
  @media (prefers-color-scheme: dark) { body { background: #0e0a1c; color: #f4f1ff; } }
  img { width: 88px; height: 88px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: .5rem 0 0; letter-spacing: -.02em; }
  p { color: #6b6385; margin: 0; font-size: .95rem; max-width: 22rem; }
  @media (prefers-color-scheme: dark) { p { color: #aca3c8; } }
</style>
</head>
<body>
  <img src="icon.png" alt="">
  <h1>Cairn</h1>
  <p>Connecting to your Cairn server. If this screen stays up, check your
     internet connection and that the server address is reachable.</p>
</body>
</html>
